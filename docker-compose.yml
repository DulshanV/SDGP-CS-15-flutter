version: "3.9"

services:
  # ── PostgreSQL Database ──
  db:
    image: postgres:16-alpine
    container_name: hscode_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hscode_user
      POSTGRES_PASSWORD: hscode_pass
      POSTGRES_DB: hscode_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hscode_user -d hscode_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hscode_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://hscode_user:hscode_pass@db:5432/hscode_db
      DATABASE_URL_SYNC: postgresql+psycopg2://hscode_user:hscode_pass@db:5432/hscode_db
      CHROMA_PERSIST_DIR: /app/data/chroma_db
      DATASET_CSV_PATH: /app/data/all_chapters_extracted.csv
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      CORS_ORIGINS: '["*"]'
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-your-firebase-project-id}
      FIREBASE_CREDENTIALS_PATH: /app/firebase-service-account.json
    volumes:
      - chroma_data:/app/data/chroma_db
      - ./all_chapters_extracted.csv:/app/data/all_chapters_extracted.csv:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
    driver: local
  chroma_data:
    driver: local
