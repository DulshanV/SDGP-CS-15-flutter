name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]   # main pushes are handled by deploy.yml

jobs:
  # ── Backend: install deps + import check ───────────────────────────────
  backend:
    name: Backend — Import & Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run tests
        env:
          ENV: development
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
          DATABASE_URL_SYNC: sqlite:///./ci_test.db
          # Dummy Firebase credentials for tests
          FIREBASE_CREDENTIALS: '{"type":"service_account","project_id":"test"}'
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing
          echo "✅ All tests passed"

      - name: Import check (app startup)
        env:
          ENV: development
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
          DATABASE_URL_SYNC: sqlite:///./ci_test.db
        run: |
          python -c "from app.main import app; print('✅ Backend app imports OK')"

  # ── Frontend: build check ───────────────────────────────────────────────
  frontend:
    name: Frontend — Next.js Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nextjs/nextjs

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Nextjs/nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Dummy Firebase config — prevents undefined errors during build
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Run tests
        run: |
          npm test
          echo "✅ All frontend tests passed"
