name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - 'Nextjs/**'
      - 'backend/**'
      - 'deploy.sh'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 20m
          script_stop: true
          script: |
            cd ~/ceylonhs
            
            # Guard: hscode.db was removed from git tracking — protect it before pull
            if [ -f "backend/data/hscode.db" ]; then
              cp backend/data/hscode.db backend/data/hscode.db.bak
            fi
            
            git pull origin main
            
            # Restore DB if git pull deleted it
            if [ ! -f "backend/data/hscode.db" ] && [ -f "backend/data/hscode.db.bak" ]; then
              cp backend/data/hscode.db.bak backend/data/hscode.db
              echo "Restored hscode.db from backup"
            fi
            
            echo "=> Installing Next.js dependencies..."
            cd Nextjs/nextjs
            npm install
            
            echo "=> Building Next.js production bundle..."
            NODE_OPTIONS="--max-old-space-size=1024" npm run build
            
            echo "=> Restarting PM2 Frontend..."
            pm2 restart ceylonhs-frontend
            
            echo "=> Installing Python dependencies..."
            cd ../../backend
            source venv/bin/activate
            pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
            deactivate
            
            echo "=> Restarting Backend..."
            sudo systemctl restart ceylonhs-backend
            
            echo "✅ Deployment complete!"
