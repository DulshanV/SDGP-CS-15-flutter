name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - 'Nextjs/**'
      - 'backend/**'
      - 'deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd ~/ceylonhs

            # ── 1. Guard DB before any git operation ──────────────────────────
            if [ -f "backend/data/hscode.db" ]; then
              cp backend/data/hscode.db backend/data/hscode.db.bak
              echo "Backed up hscode.db"
            fi

            # ── 2. Hard-reset to origin/main (avoids merge conflicts from
            #       previously-tracked large files that were removed from git) ──
            git fetch origin
            git reset --hard origin/main
            git clean -fd --exclude=backend/data/hscode.db --exclude=backend/data/hscode.db.bak

            # Restore DB if the reset deleted it
            if [ ! -f "backend/data/hscode.db" ] && [ -f "backend/data/hscode.db.bak" ]; then
              cp backend/data/hscode.db.bak backend/data/hscode.db
              echo "Restored hscode.db from backup"
            fi

            # ── 3. Write .env.local so NEXT_PUBLIC_* vars are baked into build ─
            #   NEXT_PUBLIC_API_URL is intentionally omitted – in production the
            #   browser uses relative URLs (same domain) and nginx proxies
            #   /api/v1/* to the FastAPI backend on port 8000.
            cd Nextjs/nextjs
            cat > .env.local << 'ENVEOF'
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_EMAILJS_SERVICE_ID=${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
            NEXT_PUBLIC_EMAILJS_TEMPLATE_ID=${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
            NEXT_PUBLIC_EMAILJS_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
            ENVEOF
            # Strip leading whitespace that heredoc indentation adds
            sed -i 's/^ *//' .env.local
            echo ".env.local written ($(wc -l < .env.local) lines)"

            # ── 4. Install deps and build ────────────────────────────────────
            echo "=> Installing Next.js dependencies..."
            npm install

            echo "=> Building Next.js production bundle..."
            NODE_OPTIONS="--max-old-space-size=1024" npm run build

            # ── 5. Restart frontend via ecosystem.config.js ──────────────────
            #    Stop + delete first to avoid port conflicts or stale process
            #    config from before ecosystem.config.js was introduced.
            echo "=> Restarting PM2 Frontend..."
            pm2 stop ceylonhs-frontend 2>/dev/null || true
            pm2 delete ceylonhs-frontend 2>/dev/null || true
            pm2 start /root/ceylonhs/Nextjs/nextjs/ecosystem.config.js
            pm2 save
            # Give Next.js 5 s to bind before nginx tries to connect
            sleep 5
            pm2 status ceylonhs-frontend

            # ── 6. Ensure nginx proxies /api/v1/* to the FastAPI backend ─────
            #   The Next.js frontend makes relative API calls (e.g. /api/v1/search).
            #   Nginx must forward these to uvicorn on port 8000.
            echo "=> Configuring nginx API proxy..."
            # Find the active nginx config (could be named ceylonhs, default, etc.)
            NGINX_CONF=""
            for f in /etc/nginx/sites-available/ceylonhs /etc/nginx/sites-enabled/ceylonhs \
                     /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default \
                     /etc/nginx/conf.d/ceylonhs.conf /etc/nginx/conf.d/default.conf; do
              if [ -f "$f" ]; then
                NGINX_CONF="$f"
                break
              fi
            done
            
            if [ -n "$NGINX_CONF" ]; then
              echo "   Found nginx config: $NGINX_CONF"
              if ! grep -q 'location /api/' "$NGINX_CONF"; then
                # Insert the /api/ proxy block before the last closing brace
                sed -i '/^}/i\
            \n    # Proxy API requests to FastAPI backend\
                location /api/ {\
                    proxy_pass http://127.0.0.1:8000;\
                    proxy_set_header Host $host;\
                    proxy_set_header X-Real-IP $remote_addr;\
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\
                    proxy_set_header X-Forwarded-Proto $scheme;\
                    proxy_read_timeout 120s;\
                }\
            ' "$NGINX_CONF"
                nginx -t && systemctl reload nginx
                echo "   Added /api/ proxy block to nginx"
              else
                echo "   /api/ proxy block already present – skipping"
              fi
            else
              echo "   ⚠ No nginx config found – API proxy not configured"
              echo "   Checked: ceylonhs, default in sites-available/enabled/conf.d"
            fi

            # ── 7. Backend ───────────────────────────────────────────────────
            echo "=> Installing Python dependencies..."
            cd /root/ceylonhs/backend
            source venv/bin/activate
            pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
            deactivate

            echo "=> Restarting Backend..."
            sudo systemctl restart ceylonhs-backend

            echo "✅ Deployment complete!"
